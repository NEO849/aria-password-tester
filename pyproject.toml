[project]
name = "aria-password-tester"
version = "1.0.0"
description = "Web-Passwortstärke-Tester mit Live-Analyse und HIBP-Check"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.29.0",
  "pydantic>=2.6.0",
  "pydantic-settings>=2.2.0",
  "slowapi>=0.1.9",
  "httpx>=0.27.0",
  "zxcvbn>=4.4.28",
  "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0", "ruff>=0.3.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
